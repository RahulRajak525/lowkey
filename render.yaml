# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the Express/Bun API and the Vite web app as two services.
services:
  - type: web
    name: whisper-api
    runtime: node
    plan: free
    region: singapore          # pick the region closest to your MongoDB Atlas cluster
    rootDir: backend
    buildCommand: bun install
    startCommand: bun run start
    healthCheckPath: /health
    envVars:
      - key: BUN_VERSION
        value: 1.3.14          # matches your local bun
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false            # set in the Render dashboard
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false            # https://whisper-web.onrender.com (no trailing slash)

  - type: web
    name: whisper-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL
        sync: false            # https://whisper-api.onrender.com
    routes:
      - type: rewrite          # SPA fallback so client routes don't 404
        source: /*
        destination: /index.html
